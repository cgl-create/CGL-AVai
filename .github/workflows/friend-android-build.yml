name: Friend Android build

on:
  push:
    branches: [main]
    paths:
      - "Friend/**"
      - ".github/workflows/friend-android-build.yml"
  pull_request:
    paths:
      - "Friend/**"
      - ".github/workflows/friend-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble Friend debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: Friend
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Friend-debug-apk
          path: Friend/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
