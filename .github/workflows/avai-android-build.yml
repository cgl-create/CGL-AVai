name: AVai Android build
on:
  push:
    branches: [main]
    paths:
      - "AVai/**"
      - ".github/workflows/avai-android-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble-debug:
    name: Assemble AVai debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Restore optional Firebase configuration and debug keystore
        env:
          AVAI_CONFIG_B64: ${{ secrets.AVAI_GOOGLE_SERVICES_JSON_BASE64 }}
          DEBUG_KEYSTORE_B64: ${{ secrets.CGLPLUS_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AVAI_CONFIG_B64" ]; then
            printf '%s' "$AVAI_CONFIG_B64" | base64 --decode > AVai/app/google-services.json
          fi
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: AVai
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AVai-debug-apk
          path: AVai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
